name: Build APK

on:
  push:
    branches:
      - android10-compatibility
      - re-write
  pull_request:
    branches:
      - android10-compatibility
      - re-write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Download and Install CMake 3.31.4
        run: |
          mkdir -p /tmp/cmake
          cd /tmp/cmake
          wget https://github.com/Kitware/CMake/releases/download/v3.31.4/cmake-3.31.4-linux-x86_64.tar.gz
          tar -xzf cmake-3.31.4-linux-x86_64.tar.gz
          sudo mv cmake-3.31.4-linux-x86_64 /opt/cmake
          sudo ln -sf /opt/cmake/bin/cmake /usr/local/bin/cmake
          cmake --version
      
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          CMAKE_PREFIX_PATH: /opt/cmake
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      - name: Create Release (on push to android10-compatibility)
        if: github.event_name == 'push' && github.ref == 'refs/heads/android10-compatibility'
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: android10-build-${{ github.run_number }}
          body: |
            ## Android 10 Compatibility Build
            
            Built from commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
            
            ### Installation:
            1. Download the APK file below
            2. Transfer to your Samsung Note 9
            3. Open file manager and tap the APK to install
            
            ### Testing:
            - Test UI/Display on Android 10
            - Check app launch and features
            - Report any issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
